[project]
name = "vynn_core"
version = "0.1.0"
description = "The shared news data layer behind VYNN AI: articles in MongoDB, feeds in Redis."
authors = [
    {name = "VYNN AI", email = "zanwen.fu@duke.edu"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymongo>=4.0.0",
    "redis>=4.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "mongomock>=4.1.2",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
